# One-command lab: docker compose up -d, then open http://127.0.0.1:8787
# Relay credentials: docker compose exec iris cat /usr/irissys/mgr/relay/lab-credentials.json
# The IRIS web server is published too: Management Portal at
# http://127.0.0.1:52773/csp/sys/UtilHome.csp (SuperUser / SYS, local lab only) and the
# IRIS-served Relay UI at http://127.0.0.1:52773/relay/index.html.
# Disposable demonstration data only. Every port is published on 127.0.0.1 only.
# IRIS_BIND=0.0.0.0 publishes the IRIS web server on every interface (plain HTTP, the
# well-known SuperUser / SYS login: only on a trusted network, and change that password).
# IRIS_PORT=52774 picks another host port if 52773 is taken.
name: iris-relay

services:
  iris:
    image: containers.intersystems.com/intersystems/iris-community@sha256:87c8b9062530093d30384d66caa9933b8399bfbace7ddb7f1bdb983c0bfdb85b
    command:
      - --before
      - rm -f /usr/irissys/mgr/relay/.bootstrap-ok
      - --after
      # --unexpire-predefined and --serve-ui are for this local lab only;
      # compose.demo.yaml replaces this command without them.
      - python3 /opt/relay/scripts/bootstrap.py --src /opt/relay --credentials-file /usr/irissys/mgr/relay/lab-credentials.json --public-url http://127.0.0.1:52773 --ready-file /usr/irissys/mgr/relay/.bootstrap-ok --unexpire-predefined --serve-ui /opt/relay/web/relay
    volumes:
      - ./src:/opt/relay/src:ro
      - ./fixtures:/opt/relay/fixtures:ro
      - ./scripts:/opt/relay/scripts:ro
      - ./web:/opt/relay/web:ro
    ports:
      # Relay (Node) shares this network namespace, so its port is published here.
      - "127.0.0.1:8787:8787"
      # IRIS web server: Management Portal, /api/admin, /api/relay and /relay.
      - "${IRIS_BIND:-127.0.0.1}:${IRIS_PORT:-52773}:52773"
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "test", "-f", "/usr/irissys/mgr/relay/.bootstrap-ok"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  relay:
    image: node:22-alpine
    user: node
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      IRIS_URL: http://127.0.0.1:52773
      PORT: "8787"
      RELAY_LISTEN_HOST: 0.0.0.0
    volumes:
      - ./:/app:ro
    network_mode: service:iris
    depends_on:
      iris:
        condition: service_healthy
        # Relay lives in the IRIS network namespace, so it must restart with IRIS.
        restart: true
    restart: unless-stopped
